tags:
  - Auth
summary: Register a new user
operationId: registerUser
description: Register a new user with name, email and password.
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - email
          - password
        properties:
          email:
            type: string
            format: email
            example: user@example.com
          password:
            type: string
            format: password
            example: strongPassword123
responses:
  '201':
    description: User registered successfully
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: string
              example: success
            data:
              type: object
              properties:
                userId:
                  type: string
                  example: 65e4decdd286b30065d54af9
  '400':
    $ref: '../../components/responses/400.yaml'
  '409':
    description: Email already exists
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: string
              example: error
            message:
              type: string
              example: Email already in use
