type: object
properties:
  name:
    description: "Contact's name"
    type: string
    example: 'John Doe'
  phoneNumber:
    description: "Contact's phone number"
    type: string
    example: '+380000000006'
  contactType:
    description: "Contact's type"
    type: string
    enum: ['work', 'home', 'personal']
  email:
    description: "Contact's email"
    type: string
    example: 'JohnDoe@gmail.com'
  isFavourite:
    description: "Contact's favourite"
    type: boolean
    example: false
  photo:
    description: "Contact's photo (binary upload)"
    type: string
    format: binary
